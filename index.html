<style>
/* ============================================================================
 * style.css —— 布景 / 角色 / 动画
 * ==========================================================================*/
:root {
  --ink: #43413d;
  --gold: #ffd166;
  --pink: #ff9ebb;
  --deep: #070b1a;
  --cw: clamp(126px, 17vw, 250px);
  --serif: "Songti SC", "Noto Serif SC", "STSong", SimSun, serif;
  --kai: "Kaiti SC", "STKaiti", KaiTi, "楷体", var(--serif);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  background: #060a18;
  color: #fff;
  overflow: hidden;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
svg { display: block; }
button { font-family: inherit; }

#fx { position: fixed; inset: 0; z-index: 3; pointer-events: none; transition: opacity .6s ease; }
/* 最后一屏的信要看清楚，这时候把粒子收掉 */
body.card-open #fx { opacity: 0; }
#stage { position: fixed; inset: 0; z-index: 2; }

/* ------------------------------------------------------------------ 场景 */
.scene {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity .85s ease, visibility .85s;
  overflow: hidden;
}
.scene.active { opacity: 1; visibility: visible; z-index: 2; }

.bg { position: absolute; inset: 0; }

/* 角色位 */
.char {
  position: absolute;
  width: var(--cw);
  bottom: 24vh;
  z-index: 3;
  filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .32));
  transition: left .7s cubic-bezier(.3, .9, .3, 1), right .7s cubic-bezier(.3, .9, .3, 1),
              bottom .7s ease, transform .7s ease, opacity .6s;
}
.char svg { width: 100%; height: auto; animation: bob 4.8s ease-in-out infinite; }
.char:nth-of-type(2) svg { animation-delay: -1.7s; }
.char-l { left: 9vw; }
.char-r { right: 9vw; }

@keyframes bob {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -9px; }
}

/* SVG 内部的小动作（用独立属性，避免覆盖 transform 属性） */
.char-svg .blink { transform-box: fill-box; transform-origin: center; animation: blink 5.6s infinite; }
.char-svg .blink:nth-of-type(2) { animation-delay: .4s; }
@keyframes blink {
  0%, 93%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(.14); }
}
.char-svg .bow { transform-box: fill-box; transform-origin: center; animation: wiggle 3.4s ease-in-out infinite; }
.char-svg .crest { transform-box: fill-box; transform-origin: 12% 88%; animation: wiggle 3.9s ease-in-out infinite; }
.char-svg .feathers { transform-box: fill-box; transform-origin: 12% 6%; animation: sway 5.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { rotate: -3deg; } 50% { rotate: 3.5deg; } }
@keyframes sway { 0%, 100% { rotate: -2deg; } 50% { rotate: 2.4deg; } }

/* 道具 */
.prop, .critter { position: absolute; z-index: 2; }
.prop-svg, .part-svg { width: 100%; height: auto; }
[data-prop] { line-height: 0; }

/* ============================================================ 0 · 封面 */
.bg-night {
  background:
    radial-gradient(1100px 620px at 74% 12%, rgba(120, 150, 255, .22), transparent 62%),
    radial-gradient(900px 520px at 18% 88%, rgba(255, 140, 190, .16), transparent 65%),
    linear-gradient(180deg, #060a1f 0%, #0d1533 42%, #1b1f45 72%, #2b2148 100%);
}
.moon {
  position: absolute; top: 9vh; right: 13vw;
  width: clamp(70px, 8vw, 132px); aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, #fffdf2, #ffeec4 58%, #f2d79a);
  box-shadow: 0 0 60px 18px rgba(255, 236, 190, .34), 0 0 160px 60px rgba(255, 214, 140, .16);
  animation: moonFloat 9s ease-in-out infinite;
}
@keyframes moonFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -14px; } }
.hill {
  position: absolute; left: -10%; right: -10%; border-radius: 50% 50% 0 0;
}
.hill-far { bottom: 16vh; height: 26vh; background: rgba(26, 32, 74, .85); filter: blur(1px); }
.hill-near {
  bottom: 0; height: 24vh; left: -20%; right: -20%;
  background: linear-gradient(180deg, #131a3d, #0a0f28);
}
.entry-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-bottom: 6vh;
  text-align: center;
}
.eyebrow {
  font-size: clamp(11px, 1.15vw, 15px); letter-spacing: .5em; margin: 0 0 2.2vh;
  color: rgba(255, 226, 170, .82); text-indent: .5em;
}
.entry-title {
  font-family: var(--serif);
  font-size: clamp(32px, 6.4vw, 84px);
  margin: 0; letter-spacing: .1em; text-indent: .1em;
  background: linear-gradient(180deg, #fffaf0, #ffe1a8 60%, #ffc9d8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 26px rgba(255, 200, 120, .3));
  animation: riseIn 1.4s ease both;
}
.amp { color: #ff5f8a; -webkit-text-fill-color: #ff5f8a; animation: beat 1.8s ease-in-out infinite; display: inline-block; }
@keyframes beat { 0%, 100% { scale: 1; } 22% { scale: 1.22; } 46% { scale: 1; } }
@keyframes riseIn { from { opacity: 0; translate: 0 22px; } to { opacity: 1; translate: 0 0; } }
.entry-sub {
  font-family: var(--serif);
  font-size: clamp(14px, 1.7vw, 22px); letter-spacing: .34em; text-indent: .34em;
  color: rgba(255, 255, 255, .8); margin: 2.6vh 0 0;
  animation: riseIn 1.4s .3s ease both;
}
.couple { display: flex; align-items: flex-end; gap: clamp(18px, 7vw, 130px); }
.couple-entry { margin-top: 4.5vh; animation: riseIn 1.5s .5s ease both; }
.couple-entry .char { position: relative; bottom: 0; width: calc(var(--cw) * .92); filter: none; }
.couple-entry .char svg { animation: bob 4.8s ease-in-out infinite; }
.entry-hint {
  margin: 4.3vh 0 0; font-size: clamp(12px, 1.15vw, 15px); color: rgba(255, 255, 255, .62);
  letter-spacing: .16em;
  animation: hintPulse 2.6s ease-in-out infinite;
}
@keyframes hintPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

/* ============================================================ 1 · 高中 */
.bg-day {
  background:
    radial-gradient(900px 520px at 82% 8%, rgba(255, 240, 190, .75), transparent 60%),
    linear-gradient(180deg, #cfeaff 0%, #e2f4ff 46%, #f4fbff 68%, #dfeefb 100%);
}
.sun {
  position: absolute; top: 7vh; left: 12vw; width: clamp(56px, 6vw, 96px); aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 38%, #fffdf0, #ffe9a8 62%, #ffd166);
  box-shadow: 0 0 70px 24px rgba(255, 223, 150, .55);
}
.bg-cloud {
  position: absolute; height: 5vh; border-radius: 999px;
  background: rgba(255, 255, 255, .9);
  filter: blur(.4px);
  animation: drift 42s linear infinite;
}
.bg-cloud::before, .bg-cloud::after {
  content: ""; position: absolute; background: inherit; border-radius: 999px;
}
.bg-cloud::before { width: 60%; height: 170%; left: 12%; top: -80%; }
.bg-cloud::after { width: 45%; height: 130%; right: 10%; top: -60%; }
.c1 { width: 16vw; top: 12vh; left: -20vw; animation-duration: 56s; }
.c2 { width: 22vw; top: 22vh; left: -30vw; animation-duration: 74s; animation-delay: -22s; opacity: .8; }
.c3 { width: 13vw; top: 7vh; left: -16vw; animation-duration: 64s; animation-delay: -40s; }
@keyframes drift { from { translate: -10vw 0; } to { translate: 118vw 0; } }

.school {
  position: absolute; left: 50%; translate: -50% 0; bottom: 46vh; width: min(74vw, 900px);
  opacity: .96;
}
.school-roof {
  height: 3.2vh; margin: 0 -3%; border-radius: 8px 8px 3px 3px;
  background: linear-gradient(180deg, #6f8fb0, #53718f);
}
.school-wall {
  position: relative; height: 22vh; border-radius: 4px;
  background: linear-gradient(180deg, #f7f2e8, #e8e0d2);
  box-shadow: inset 0 -14px 0 rgba(0, 0, 0, .05);
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.4vw 1.6vw;
  padding: 2vh 2.6vw 1.4vh;
}
.school-wall i {
  border-radius: 3px;
  background: linear-gradient(180deg, #a8d4f0, #7fb6dd);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .7);
}
.school-door {
  position: absolute; left: 50%; translate: -50% 0; bottom: 0;
  width: 12%; height: 40%;
  border-radius: 6px 6px 0 0;
  background: linear-gradient(180deg, #5f7f9e, #43607c);
}
.ground {
  position: absolute; left: 0; right: 0; bottom: 0; height: 48vh;
  background: linear-gradient(180deg, #9db8cf 0%, #8fb0c9 14%, #86a3bd 100%);
}
.scene-school .char { bottom: 20vh; }
.scene-school .char-l { left: 14vw; }
.scene-school .char-r { right: 14vw; }
/* 塑胶球场（透视场地 + 球网）铺满地面 */
.prop-court { left: 0; right: 0; bottom: 0; width: 100%; z-index: 2; }
.shuttle-trail {
  position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3;
  opacity: 0; transition: opacity .5s;
}
.scene-school[data-beat="2"] .shuttle-trail { opacity: .85; }
.shuttle-trail path {
  fill: none; stroke: rgba(255, 255, 255, .85); stroke-width: 2.4px;
  stroke-dasharray: 9 15; stroke-linecap: round;
  animation: trailFlow 1.1s linear infinite;
}
@keyframes trailFlow { to { stroke-dashoffset: -48; } }
.prop-shuttle { left: 45%; top: 50%; width: clamp(34px, 3.6vw, 54px); z-index: 5; }
.prop-note {
  left: 50%; bottom: 56vh; width: clamp(60px, 6vw, 96px); opacity: 0;
  transition: .7s cubic-bezier(.3, .9, .3, 1); z-index: 5;
}
.uniform-card {
  position: absolute; left: 4vw; top: 6vh; width: clamp(190px, 20vw, 290px);
  padding: 14px 16px 12px; border-radius: 18px; z-index: 6;
  background: rgba(255, 255, 255, .93);
  border: 2px solid rgba(120, 170, 210, .55);
  box-shadow: 0 18px 40px rgba(40, 80, 120, .22);
  color: #23405c; font-size: clamp(11px, 1.02vw, 14px); line-height: 1.7;
  opacity: 0; translate: -18px 0; transition: .7s cubic-bezier(.3, .9, .3, 1);
}
.uniform-card p { margin: 8px 0 0; }
.uniform-card b { color: #16386b; letter-spacing: .1em; }
.uniform-art { border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, #eaf6ff, #d5ecfa); }
.scene-school[data-beat="1"] .uniform-card,
.scene-school[data-beat="2"] .uniform-card,
.scene-school[data-beat="3"] .uniform-card { opacity: 1; translate: 0 0; }
.scene-school[data-beat="2"] .prop-shuttle { animation: shuttleFly 1.9s cubic-bezier(.4, 0, .6, 1) infinite; }
.scene-school[data-beat="3"] .prop-shuttle { opacity: 0; }
@keyframes shuttleFly {
  0% { left: 22%; top: 60%; rotate: -20deg; }
  50% { left: 50%; top: 36%; rotate: 150deg; }
  100% { left: 78%; top: 60%; rotate: 330deg; }
}
/* 挥拍：手绘线里那只手拿的球拍来回挥 */
.scene-school[data-beat="2"] .char-svg .held {
  transform-box: fill-box; transform-origin: 50% 96%;
  animation: swing 1.9s cubic-bezier(.4, 0, .6, 1) infinite;
}
.scene-school[data-beat="2"] .char-r .char-svg .held { animation-delay: -0.95s; }
@keyframes swing { 0%, 100% { rotate: -18deg; } 45% { rotate: 26deg; } }
.scene-school[data-beat="3"] .prop-note { opacity: 1; animation: noteFly 2.6s ease-in-out infinite; }
@keyframes noteFly {
  0%, 100% { translate: 0 0; rotate: -7deg; }
  50% { translate: -6vw 3vh; rotate: 8deg; }
}

/* ============================================================ 2 · 食堂 */
.bg-canteen {
  background:
    radial-gradient(760px 460px at 50% 4%, rgba(255, 247, 216, .9), transparent 62%),
    linear-gradient(180deg, #fdf4e6 0%, #f8ead4 44%, #efdcc0 100%);
}
.bg-canteen::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46vh;
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .5) 0 2px, transparent 2px 76px),
    repeating-linear-gradient(180deg, rgba(255, 255, 255, .5) 0 2px, transparent 2px 58px),
    linear-gradient(180deg, #d3e8db, #b9d8c6);
}
.canteen-windows {
  position: absolute; left: 7vw; right: 7vw; top: 7vh; height: 18vh; z-index: 1;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.4vw;
}
.canteen-windows i {
  border-radius: 10px 10px 4px 4px;
  background: linear-gradient(180deg, #d3ecff 0%, #b6dcf6 60%, #cfe6f4 100%);
  border: 6px solid #fdfaf3;
  box-shadow: 0 10px 22px rgba(120, 150, 180, .18), inset 0 0 0 1px rgba(255, 255, 255, .7);
}
.canteen-windows i:nth-child(1) { background-image: linear-gradient(180deg, #f6fbff, #d8edfb); }
.canteen-board {
  position: absolute; left: 6vw; top: 31vh; width: min(23vw, 300px); z-index: 1;
  padding: 16px 18px; border-radius: 10px;
  background: #34503f; border: 6px solid #8a6a44;
  box-shadow: 0 14px 28px rgba(60, 40, 20, .22);
}
.canteen-board i { display: block; height: 8px; margin: 0 0 10px; border-radius: 4px; background: rgba(255, 255, 255, .6); }
.canteen-board i:nth-child(2) { width: 82%; }
.canteen-board i:nth-child(3) { width: 64%; }
.canteen-board i:nth-child(4) { width: 76%; }
.canteen-board i:nth-child(5) { width: 46%; }
.canteen-lamp { position: absolute; top: 0; width: 3px; height: 8vh; background: #cbb693; z-index: 1; }
.canteen-lamp::after {
  content: ""; position: absolute; left: 50%; top: 100%; translate: -50% 0;
  width: 54px; height: 22px; border-radius: 0 0 28px 28px;
  background: linear-gradient(180deg, #fff8dd, #ffd98a);
  box-shadow: 0 16px 46px rgba(255, 214, 120, .6);
}
.canteen-lamp.l1 { left: 33%; }
.canteen-lamp.l2 { right: 33%; }
.scene-canteen .char { bottom: 30vh; width: calc(var(--cw) * .95); z-index: 3; }
.scene-canteen .char-l { left: 50%; right: auto; margin-left: calc(var(--cw) * -1.02); }
.scene-canteen .char-r { left: 50%; right: auto; margin-left: calc(var(--cw) * .06); }
.prop-table { left: 50%; translate: -50% 0; bottom: 16vh; width: min(78vw, 1040px); z-index: 4; }
.prop-drumstick {
  left: 50%; bottom: 40vh; width: clamp(38px, 4vw, 60px); z-index: 6;
  opacity: 0; transition: opacity .6s;
}
.scene-canteen[data-beat="0"] .prop-drumstick { opacity: 1; animation: passLeg 3.4s ease-in-out infinite; }
@keyframes passLeg {
  0% { left: 60%; bottom: 38vh; rotate: -12deg; }
  45% { left: 39%; bottom: 45vh; rotate: 14deg; }
  55% { left: 39%; bottom: 45vh; rotate: 14deg; }
  100% { left: 60%; bottom: 38vh; rotate: -12deg; }
}
.steam {
  position: absolute; z-index: 5; width: clamp(26px, 2.6vw, 40px); height: clamp(30px, 3.4vh, 50px);
  border-radius: 50%; background: rgba(255, 255, 255, .6);
  filter: blur(6px); opacity: 0; pointer-events: none;
}
.steam.st1 { left: 32%; bottom: 30vh; animation: steamUp 3.6s ease-in-out infinite; }
.steam.st2 { left: 58%; bottom: 31vh; animation: steamUp 3.6s ease-in-out infinite .9s; }
@keyframes steamUp {
  0% { opacity: 0; translate: 0 0; scale: .7; }
  28% { opacity: .85; }
  100% { opacity: 0; translate: 0 -70px; scale: 1.6; }
}

/* ========================================================== 3 · 欧美社团 */
.bg-hall {
  background:
    radial-gradient(900px 560px at 50% 18%, rgba(255, 214, 150, .28), transparent 62%),
    linear-gradient(180deg, #14162b 0%, #1d1b34 48%, #2a1f2f 78%, #17141f 100%);
}
.bg-hall::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 120px);
}
.prop-screen { left: 50%; translate: -50% 0; top: 11vh; width: min(58vw, 760px); z-index: 2; }
.screen-copy {
  position: absolute; left: 10%; right: 10%; top: 22%;
  text-align: center; color: #ffe6b0; z-index: 3;
  font-family: var(--serif); letter-spacing: .22em; line-height: 1.5;
}
.screen-copy span { display: block; font-size: clamp(15px, 2.1vw, 30px); text-shadow: 0 0 20px rgba(255, 200, 120, .6); }
.screen-copy em {
  display: block; margin-top: .8em; font-style: normal; font-size: clamp(10px, 1.05vw, 15px);
  color: rgba(255, 255, 255, .68); letter-spacing: .3em;
}
.club-tag {
  position: absolute; top: 44vh; z-index: 5;
  padding: 7px 15px; border-radius: 999px;
  font-size: clamp(10px, 1vw, 13px); letter-spacing: .12em;
  background: rgba(255, 209, 102, .16); border: 1px solid rgba(255, 209, 102, .5);
  color: #ffe1a0; backdrop-filter: blur(4px);
  opacity: 0; transition: .6s;
}
.tag-l { left: 10vw; } .tag-r { right: 10vw; }
.scene-club[data-beat="1"] .club-tag,
.scene-club[data-beat="2"] .club-tag { opacity: 1; }
.prop-popcorn { left: 20vw; bottom: 46vh; width: clamp(52px, 5.4vw, 84px); }
.prop-gift {
  left: 50%; translate: -50% 0; bottom: 44vh; width: clamp(56px, 5.6vw, 88px);
  opacity: 0; transition: .7s cubic-bezier(.3, .9, .3, 1);
}
.prop-note2 {
  left: 50%; translate: -50% 0; bottom: 34vh; width: clamp(60px, 6vw, 96px);
  opacity: 0; transition: .7s;
}
.scene-club[data-beat="1"] .prop-gift { opacity: 1; animation: giftFloat 2.8s ease-in-out infinite; }
.scene-club[data-beat="2"] .prop-note2 { opacity: 1; animation: noteFly 3s ease-in-out infinite; }
@keyframes giftFloat { 0%, 100% { translate: -50% 0; } 50% { translate: -50% -14px; } }
.scene-club .char { bottom: 22vh; }
.scene-club .char-l { left: 12vw; } .scene-club .char-r { right: 12vw; }

/* ============================================================ 3 · 双城记 */
.bg-map {
  background:
    radial-gradient(1200px 700px at 62% 30%, rgba(80, 140, 220, .22), transparent 66%),
    linear-gradient(180deg, #070d20 0%, #0c1730 52%, #0a1024 100%);
}
.bg-map::after {
  content: ""; position: absolute; inset: 0; opacity: .3;
  background-image:
    linear-gradient(rgba(140, 190, 255, .14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140, 190, 255, .14) 1px, transparent 1px);
  background-size: 62px 62px, 62px 62px;
}
.route-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; overflow: visible; }.route-line, .route-glow { fill: none; stroke-linecap: round; }
.route-line { stroke: #ffd166; stroke-width: 2.4; stroke-dasharray: 9 11; animation: dash 3.4s linear infinite; }
.route-glow { stroke: rgba(255, 209, 102, .28); stroke-width: 12; }
@keyframes dash { to { stroke-dashoffset: -40; } }
.city {
  position: absolute; z-index: 4; text-align: center;
  color: #eaf3ff; font-size: clamp(11px, 1.1vw, 15px);
}
.city b { display: block; font-weight: 600; letter-spacing: .08em; }
.city i { display: block; font-style: normal; font-size: .82em; color: rgba(180, 210, 255, .72); margin-top: .25em; }
.city .pin { position: relative; display: block; width: clamp(20px, 2vw, 30px); margin: 0 auto 4px; }
.city-bj { right: 19%; top: 10%; }
.city-km { left: 16%; top: 39%; }
.prop-train {
  left: 70%; top: 17%; width: clamp(70px, 7vw, 112px); z-index: 5;
  animation: ride 13s ease-in-out infinite;
}
@keyframes ride {
  0% { left: 74%; top: 8%; rotate: 6deg; }
  50% { left: 45%; top: 9%; rotate: 4deg; }
  100% { left: 13%; top: 31%; rotate: 26deg; }
}
.scene-distance .critter-dog { right: 6%; top: 12%; width: clamp(62px, 6vw, 100px); z-index: 4; animation: bob 5s ease-in-out infinite; }
.scene-distance .critter-cat { left: 4%; top: 40%; width: clamp(58px, 5.6vw, 92px); z-index: 4; animation: bob 5.6s ease-in-out infinite reverse; }
.bubble {
  position: absolute; z-index: 6; max-width: 22vw;
  padding: 9px 15px; border-radius: 16px;
  font-size: clamp(11px, 1.05vw, 14px); line-height: 1.5;
  background: rgba(255, 255, 255, .95); color: #22374f;
  box-shadow: 0 12px 26px rgba(0, 0, 0, .3);
  opacity: 0; transition: .6s;

/* ======================================================= 7 · 婚礼彩蛋 */
.bg-church {

.scene-wedding .char-r { right: 28vw; }

.scene-wedding[data-beat="2"] .char-r { right: 32vw; }
.scene-wedding[data-beat="3"] .char-l { left: 30vw; }
.scene-wedding[data-beat="3"] .char-r { right: 30vw; }

/* ================================================================== 文案 */
#caption {
  position: fixed; left: 50%; bottom: clamp(18px, 4.4vh, 52px);
  translate: -50% 16px; z-index: 5;
  width: min(90vw, 900px); text-align: center;
  opacity: 0; transition: opacity .55s ease, translate .55s ease;
  pointer-events: none;
}
#caption.show { opacity: 1; translate: -50% 0; }
#caption p {
  margin: 0; display: inline-block;
  padding: clamp(12px, 1.5vh, 18px) clamp(18px, 2.4vw, 34px);
  border-radius: 18px;
  background: rgba(10, 15, 32, .74);
  border: 1px solid rgba(255, 209, 102, .34);

  pointer-events: none;
}

#nextHint.hide { opacity: 0; }

/* ================================================================== HUD */
#hud {
  position: fixed; inset: 0 0 auto 0; z-index: 9;
  display: flex; align-items: center; justify-content: center;
  padding: clamp(10px, 2vh, 22px) clamp(12px, 2vw, 26px);
  pointer-events: none;
}
.dots { display: flex; gap: 9px; pointer-events: auto; }
.dot {
  border: 0; padding: 6px 0; background: none; cursor: pointer;
  display: grid; place-items: center;
}
.dot span {
  display: block; width: 9px; height: 9px; border-radius: 999px;
  background: rgba(255, 255, 255, .3);
  transition: .4s;
}
.dot.past span { background: rgba(255, 209, 102, .55); }
.dot.on span { width: 26px; background: var(--gold); box-shadow: 0 0 14px rgba(255, 209, 102, .8); }
.hud-right {
  position: absolute; right: clamp(12px, 2vw, 26px); top: clamp(10px, 2vh, 22px);
  display: flex; gap: 10px; pointer-events: auto;
}
.hud-btn {
  width: clamp(34px, 3vw, 42px); aspect-ratio: 1; cursor: pointer;
  border-radius: 50%; border: 1px solid rgba(255, 255, 255, .28);
  background: rgba(12, 18, 38, .55); color: #ffe9bd;
  font-size: clamp(14px, 1.3vw, 18px);
  backdrop-filter: blur(6px);
  transition: .3s;
}
.hud-btn:hover { background: rgba(255, 209, 102, .2); border-color: var(--gold); }
.hud-btn.off { color: rgba(255, 255, 255, .4); }

  .scene-stranger[data-beat="3"] .char-r { right: 12vw; }

  .char-mj { left: 32% !important; }
  .scene-wedding .char-r { right: 12vw; }
  .scene.scene-wedding .char-l { left: 9vw; }
  .scene.scene-wedding .char-r { right: 9vw; }
  .scene.scene-wedding[data-beat="2"] .char-l { left: 15vw; }
  .scene.scene-wedding[data-beat="2"] .char-r { right: 15vw; }
  .scene.scene-wedding[data-beat="3"] .char-l { left: 11vw; }
  .scene.scene-wedding[data-beat="3"] .char-r { right: 11vw; }
  .scene.scene-wedding[data-beat="4"] .char-l { left: 17vw; }
  .scene.scene-wedding[data-beat="4"] .char-r { right: 17vw; }

  .scene.scene-promise .char-r { left: 50%; margin-left: calc(var(--cw) * .02); }
  .scene.scene-school .char,
  .scene.scene-club .char,

  .final-card { width: 92vw; max-height: 76vh; }
  #caption { bottom: 92px; }
  #nextHint { display: none; }
}
@media (max-height: 560px) {
  .char { bottom: 30vh; }

}

@media (prefers-reduced-motion: reduce) {

html.static-shot .scene.active { visibility: visible; }

      on = !on;
      if (CUSTOM) {
        if (!el) { el = new Audio(CUSTOM); el.loop = true; }
        el.volume = on ? 0.65 : 0;
        if (on) { var p = el.play(); if (p && p.catch) p.catch(function () {}); }
        return on;
      }
      if (master) {
        var t = A.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setTargetAtTime(on ? 0.5 : 0.0001, t, 0.15);
      }
      if (on) start();
      return on;
    }

    function chime() {
      if (!A || !on) return;
      var t = A.currentTime + 0.02;
      bell(t, mtof(84), 0.07, 1.1); bell(t + 0.07, mtof(88), 0.05, 1.2);
    }

    function blip() {
      if (!A || !on) return;
      tone(A.currentTime + 0.01, mtof(96), 0.09, 'sine', 0.035, 0.005, 0.12);
    }

    /* 婚礼钟声：一串上行琶音 + 亮和弦 */
    function fanfare() {
      if (!A) return;
      var t = A.currentTime + 0.05, i;
      var seq = [60, 64, 67, 72, 76, 79, 84];
      seq.forEach(function (m, k) { bell(t + k * 0.11, mtof(m), 0.1, 1.4); });
      var t2 = t + seq.length * 0.11 + 0.1;
      [60, 64, 67, 72, 76, 84].forEach(function (m, k) {
        bell(t2 + k * 0.02, mtof(m), 0.085, 2.6);
      });
    }

    return {
      start: start, toggle: toggle, chime: chime, blip: blip, fanfare: fanfare,
      get on() { return on; },
      get started() { return !!(A || el); }
    };
  })();

  /* =========================================================== 天幕 / 彩灯 */
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function buildSkyline() {
    var box = document.getElementById('skyline');
    if (!box || box.childElementCount) return;
    var rand = mulberry(20241001), x = -4;
    while (x < 102) {
      var w = 5 + rand() * 8, h = 20 + rand() * 48;
      var d = document.createElement('div');
      d.className = 'bldg';
      d.style.left = x + '%';
      d.style.width = w + '%';
      d.style.height = h + '%';
      d.style.opacity = (0.45 + rand() * 0.55).toFixed(2);
      box.appendChild(d);
      x += w + 0.4;
    }
  }

  function buildLights() {
    var box = document.getElementById('lights');
    if (!box || box.childElementCount) return;
    var cols = ['#ffd166', '#ff8fa3', '#8fd3ff', '#c3f0a8', '#ffb86b', '#c9a8ff'];
    var n = 15, i;
    for (i = 0; i < n; i++) {
      var t = i / (n - 1);
      var s = document.createElement('span');
      s.className = 'bulb';
      s.style.left = (t * 100).toFixed(2) + '%';
      s.style.top = (6 + 24 * Math.sin(Math.PI * t)).toFixed(2) + '%';
      s.style.color = cols[i % cols.length];
      s.style.setProperty('--d', (0.6 + i * 0.17).toFixed(2) + 's');
      s.innerHTML = C.PARTS.bulb();
      box.appendChild(s);
    }
  }

  /* ============================================================== 文案区 */
  function setCaption(txt, done) {
    caption.classList.remove('show');
    setTimeout(function () {
      capText.textContent = txt || '';
      if (txt) caption.classList.add('show');
      if (done) done();
    }, txt ? 200 : 0);
  }

  /* ============================================================== 场景控制 */
  function sceneEl(i) { return document.querySelector('.scene[data-scene="' + i + '"]'); }

  /* 最后一屏的信出现时，把飘落的粒子收掉，保证字看得清 */
  function setCard(show) {
    document.getElementById('finalCard').classList.toggle('show', !!show);
    document.body.classList.toggle('card-open', !!show);
  }

  function buildDots() {
    var html = '';
    for (var i = 0; i < total; i++) {
      html += '<button class="dot" type="button" data-i="' + i + '" title="第 ' + (i + 1) +
        ' 幕"><span></span></button>';
    }
    dotsBox.innerHTML = html;
    dotsBox.addEventListener('click', function (e) {
      var b = e.target.closest('.dot');
      if (!b) return;
      e.stopPropagation();
      if (locked) return;
      gotoScene(+b.dataset.i);
    });
  }

  function syncDots() {
    dotsBox.querySelectorAll('.dot').forEach(function (d, i) {
      d.classList.toggle('on', i === cur);
      d.classList.toggle('past', i < cur);
    });
  }

  function gotoScene(i, b) {
    i = Math.max(0, Math.min(total - 1, i));
    b = b || 0;
    var old = sceneEl(cur);
    if (old && old !== sceneEl(i)) old.classList.remove('active');
    cur = i; beat = b;
    var sc = sceneEl(i);
    sc.classList.add('active');
    sc.dataset.beat = String(b);
    applyBeat(i, b);
    var key = D.SCENES[i].key;
    FX.setMode(D.SCENES[i].fx || 'stars');
    if (key === 'spidey') buildSkyline();
    if (key === 'stranger') buildLights();
    var bt = D.SCENES[i].beats[b];
    setCaption(bt ? bt.text : '');
    syncDots();
    updateHint();
    if (key === 'wedding' && b === 0) setTimeout(function () { Music.fanfare(); }, 600);
    if (key !== 'entry') Music.chime();
    /* 最后一幕的收尾 */
    setCard(key === 'wedding' && b >= D.SCENES[i].beats.length);
    if (key === 'wedding' && b >= D.SCENES[i].beats.length) showDays();
    /* 锁一小会儿，防止连点冲太快 */
    locked = true;
    setTimeout(function () { locked = false; }, 260);
  }

  function updateHint() {
    var key = D.SCENES[cur].key;
    var isLast = beat >= D.SCENES[cur].beats.length - 1;
    var cardShown = document.getElementById('finalCard').classList.contains('show');
    var needHeart = key === 'promise' && isLast;
    nextHint.classList.toggle('hide', needHeart || cardShown);
    nextHint.classList.toggle('last', isLast && !needHeart);
    if (needHeart) nextHint.textContent = '点一下那颗心 ♥';
    else nextHint.innerHTML = (isLast ? '继续' : '点击继续') + ' <span>›</span>';
  }

  function next() {
    if (locked) return;
    var key = D.SCENES[cur].key;
    var only = D.SCENES[cur].only;
    /* 有彩蛋入口的那一幕：前面几拍照常点，只有最后一拍必须点那个东西 */
    if (only && beat >= D.SCENES[cur].beats.length - 1) return;
    var card = document.getElementById('finalCard');
    if (key === 'wedding' && card.classList.contains('show')) return;
    if (beat < D.SCENES[cur].beats.length - 1) {
      beat++;
      applyBeat(cur, beat);
      setCaption(D.SCENES[cur].beats[beat].text);
      Music.blip();
      updateHint();
      locked = true;
      setTimeout(function () { locked = false; }, 200);
    } else {
      if (key === 'wedding') {
        /* 彩蛋里的最后一屏：信 */
        setCard(true);
        showDays();
        setCaption('');
        updateHint();
        return;
      }
      gotoScene(cur + 1, 0);
    }
  }

  function prev() {
    if (locked) return;
    var card = document.getElementById('finalCard');
    if (card.classList.contains('show')) {
      setCard(false);
      updateHint();
      return;
    }
    if (beat > 0) {
      beat--;
      applyBeat(cur, beat);
      setCaption(D.SCENES[cur].beats[beat].text);
      updateHint();
    } else if (cur > 0) {
      gotoScene(cur - 1, Math.max(0, D.SCENES[cur - 1].beats.length - 1));
    }
  }

  function showDays() {
    var start = new Date(D.START + 'T00:00:00');
    var now = new Date();
    /* 满多少天：到二周年当天正好 730，和文案里「七百三十个日夜」对得上 */
    var days = Math.floor((now - start) / 86400000);
    var el = document.getElementById('daysNum');
    if (el) el.textContent = String(days);
  }

  function fillLetter() {
    var box = document.getElementById('letterBody');
    if (!box) return;
    box.innerHTML = D.LETTER.lines.map(function (t, i) {
      var cls = i === 0 ? 'salute' : (i === D.LETTER.lines.length - 1 ? 'sign' : '');
      return '<p class="' + cls + '">' + t + '</p>';
    }).join('');
  }

  /* ================================================================== 启动 */
  function init() {
    paintAll();
    buildDots();
    fillLetter();
    showDays();
    var first = sceneEl(0);
    first.classList.add('active');
    applyBeat(0, 0);
    FX.setMode(D.SCENES[0].fx);
    syncDots();
    nextHint.innerHTML = '点击开始 <span>›</span>';

    /* 进度锁：应用启动后一点点时间才允许点击，避免误触直接跳过封面 */
    locked = true;
    setTimeout(function () { locked = false; }, 900);

    /* 支持 #s=2&b=1 直接跳到某一幕（做截图 / 分享定位用）
       #auto=800 还可以自动往下播，用来做端到端自测 */
    var am = /auto=(\d+)/.exec(location.hash || '');
    if (am) {
      var gap = Math.max(120, parseInt(am[1], 10) || 800);
      setInterval(function () { if (!locked) next(); }, gap);
    }
    var m = /s=(\d+)(?:&b=(\d+))?/.exec(location.hash || '');
    if (m) {
      var si = Math.min(total - 1, parseInt(m[1], 10) || 0);
      var sb = Math.min(D.SCENES[si].beats.length, parseInt(m[2] || '0', 10) || 0);
      if (si === 0) {
        first.classList.add('active');
        applyBeat(0, 0);
      } else {
        gotoScene(si, sb);
      }
      locked = false;
    }
    if (/card/.test(location.hash || '')) {
      gotoScene(total - 1, D.SCENES[total - 1].beats.length);
      locked = false;
    }
  }

  /* 点击任意处推进 */
  document.addEventListener('click', function (e) {
    if (e.target.closest('#hud') || e.target.closest('#finalCard') ||
        e.target.closest('#eggHeart')) return;
    next();
  });

  document.getElementById('btnMusic').addEventListener('click', function (e) {
    e.stopPropagation();
    var fresh = !Music.started;
    Music.start();
    if (fresh) {                       /* 第一次点：就是开音乐 */
      this.classList.remove('off');
      this.textContent = '♪';
      return;
    }
    var on = Music.toggle();
    this.classList.toggle('off', !on);
    this.textContent = on ? '♪' : '✕';
  });

  document.getElementById('btnPrev').addEventListener('click', function (e) {
    e.stopPropagation();
    prev();
  });

  document.getElementById('eggHeart').addEventListener('click', function (e) {
    e.stopPropagation();
    if (locked) return;
    Music.fanfare();
    gotoScene(cur + 1, 0);
  });

  document.getElementById('replay').addEventListener('click', function (e) {
    e.stopPropagation();
    setCard(false);
    document.getElementById('finalCard').scrollTop = 0;
    gotoScene(0, 0);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    if (e.key === 'm' || e.key === 'M') { Music.start(); Music.toggle(); }
  });

  /* 第一次点击的时候把音乐带起来（浏览器要求用户手势） */
  document.addEventListener('click', function once() {
    Music.start();
    document.removeEventListener('click', once);
  }, { once: true });

  init();
})();

</script>
</body>
</html>
